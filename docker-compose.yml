services:
  cups-exporter:
    image: ${CUPS_EXPORTER_IMAGE:-ghcr.io/variablenix/cups-prometheus-exporter:latest}
    pull_policy: always
    container_name: cups-exporter
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    # Debian/Ubuntu commonly use GID 7 for the lp group. Override this if the
    # host's CUPS socket belongs to a different group.
    group_add:
      - "${CUPS_SOCKET_GID:-7}"
    environment:
      CUPS_SERVER: /var/run/cups/cups.sock
    volumes:
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock:ro
    ports:
      - "${CUPS_EXPORTER_PORT:-9628}:9628"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request; urllib.request.urlopen(
          'http://127.0.0.1:9628/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
